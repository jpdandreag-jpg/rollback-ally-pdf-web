name: Verify Public Rollback Ally PDF URL

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-site.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify Pages configuration and public application
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          base="https://jpdandreag-jpg.github.io/rollback-ally-pdf-web/"
          echo "GitHub Pages configuration:"
          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
             -H "Accept: application/vnd.github+json" \
             "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" |
             python3 -c 'import sys,json; p=json.load(sys.stdin); print({k:p.get(k) for k in ("html_url", "cname", "source", "build_type", "status")})'
          for path in "" "index.html" "manifest.webmanifest" "sw.js"; do
            url="${base}${path}"
            code="$(curl -sSL --max-time 25 -H "Cache-Control: no-cache" -o /tmp/page -w '%{http_code}' "$url?verify=$GITHUB_RUN_ID")"
            echo "HTTP $code $url"
            if [ "$code" != "200" ]; then
              echo "::error::Public site returned HTTP $code for $url"
              exit 1
            fi
            if [ "$path" = "" ] || [ "$path" = "index.html" ]; then
              grep -q 'Rollback Ally PDF' /tmp/page || { echo "::error::Unexpected HTML from $url"; exit 1; }
            fi
          done
          # Check the actual public HTML and current fingerprinted JavaScript.
          curl -fsSL -H "Cache-Control: no-cache" "${base}?signature=$GITHUB_RUN_ID" -o /tmp/current-index.html
          grep -q 'savedSignatureSection' /tmp/current-index.html || {
            echo "::error::Public HTML does not contain the saved signature interface"
            exit 1
          }
          bundle="$(grep -o 'src="./assets/index-[^"]*\.js"' /tmp/current-index.html | head -n 1 | cut -d '"' -f2)"
          test -n "$bundle"
          bundle_url="${base}${bundle#./}"
          curl -fsSL "$bundle_url?verify=$GITHUB_RUN_ID" -o /tmp/current-bundle.js
          grep -q 'rollback-ally-pdf.saved-signature.v1' /tmp/current-bundle.js || {
            echo "::error::The live JavaScript bundle lacks local signature storage"
            exit 1
          }
          grep -q 'Firmado:' /tmp/current-bundle.js || {
            echo "::error::The published editor does not include signature date/time labels"
            exit 1
          }
          grep -q 'Cada firma incluirá' /tmp/current-index.html || {
            echo "::error::The public interface lacks the date/time disclosure"
            exit 1
          }
          grep -q 'signatureResize' /tmp/current-index.html || {
            echo "::error::Public app lacks signature size adjustment controls"
            exit 1
          }
          grep -q 'signatureSize' /tmp/current-bundle.js || {
            echo "::error::Published JavaScript lacks signature size adjustment handler"
            exit 1
          }
          logo_url="${base}rollback-ally-logo.png"
          logo_code="$(curl -sSL --max-time 25 -H "Cache-Control: no-cache" -o /tmp/rollback-logo.png -w '%{http_code}' "$logo_url?verify=$GITHUB_RUN_ID")"
          echo "HTTP $logo_code $logo_url"
          test "$logo_code" = "200" || { echo "::error::Public Rollback Ally logo missing"; exit 1; }
          python3 -c 'import struct; b=open("/tmp/rollback-logo.png","rb").read(); assert b[:8] == bytes.fromhex("89504e470d0a1a0a"); assert struct.unpack(">II",b[16:24]) == (704,121)'
          count="$(grep -o 'src="./rollback-ally-logo.png"' /tmp/current-index.html | wc -l)"
          test "$count" -eq 2 || { echo "::error::Logo should appear in both welcome and top bar"; exit 1; }
          grep -q 'welcome-logo-panel' /tmp/current-index.html
          grep -q 'brand-logo-panel' /tmp/current-index.html
          echo "Verified corporate logo in welcome screen and header; app icon remains separate."
          echo "Verified saved signatures, timestamps and signature resizing at $bundle_url"
          echo "All public Rollback Ally PDF resources are accessible."
