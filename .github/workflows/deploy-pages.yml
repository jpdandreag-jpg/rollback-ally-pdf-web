name: Publish Rollback Ally PDF Web
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'vite.config.js'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout web app
        uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: |
          node --check src/app.js
          node --check src/utils.js
      - name: Run PDF export tests
        run: npm test
      - name: Build offline-capable app
        run: npm run build
      - name: Validate built assets
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/sw.js
          test -f dist/apple-touch-icon.png
          test -f dist/icon-192.png
          test -f dist/icon-512.png
          node --check dist/sw.js
      - name: Upload compiled website for recovery
        uses: actions/upload-artifact@v4
        with:
          name: RollbackAllyPDF-Web-PWA
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages deployment bundle
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
